<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rahul Kumawat — Full-Stack Developer, Product Builder, Creative Technologist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="50%" stop-color="#160F24"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="-20%" y1="0%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
      <animate attributeName="x1" values="-40%;120%;-40%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60%;220%;60%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;130%" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;160%" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>

  <!-- floating particles -->
  <circle cx="140" cy="70" r="2.5" fill="#A78BFA" opacity="0.55">
    <animate attributeName="cy" values="70;46;70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="90" r="3" fill="#F472B6" opacity="0.5">
    <animate attributeName="cy" values="90;120;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="200" r="2" fill="#60A5FA" opacity="0.5">
    <animate attributeName="cy" values="200;175;200" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="190" r="2.5" fill="#A78BFA" opacity="0.45">
    <animate attributeName="cy" values="190;215;190" dur="5.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="5.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="1.8" fill="#F472B6" opacity="0.4">
    <animate attributeName="cy" values="40;25;40" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- headline block, fades and rises in once -->
  <g transform="translate(0,10)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1;0.5" dur="1.8s" fill="freeze"/>
    <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI', ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2" fill="url(#textGrad)">RAHUL KUMAWAT</text>
    <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI', ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="1" fill="#C9D1D9">Full-Stack Developer · Product Builder · Creative Technologist</text>
  </g>

  <!-- shimmering underline -->
  <rect x="380" y="196" width="440" height="2" fill="url(#lineGrad)"/>
</svg>
