<svg width="680" height="46" viewBox="0 0 680 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Turning ideas into polished digital products. Interface to backend to production. Full-Stack, Real-Time, Mobile." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clip1">
      <rect x="0" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;660;660;660;660" keyTimes="0;0.02;0.05;0.30;0.333;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;0;500;500;500;500;500" keyTimes="0;0.333;0.353;0.383;0.633;0.667;0.999;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;0;460;460;460;460;460" keyTimes="0;0.667;0.687;0.717;0.967;0.999;0.9995;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .line { font-family: 'Consolas', 'SFMono-Regular', Menlo, monospace; font-size: 23px; fill: #A78BFA; }
  </style>

  <g clip-path="url(#clip1)">
    <text class="line" x="4" y="30" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.30;0.333;0.999;1" dur="9s" repeatCount="indefinite"/>
      Turning ideas into polished digital products
    </text>
  </g>

  <g clip-path="url(#clip2)">
    <text class="line" x="4" y="30" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.363;0.633;0.667;1" dur="9s" repeatCount="indefinite"/>
      Interface &#8594; Backend &#8594; Production
    </text>
  </g>

  <g clip-path="url(#clip3)">
    <text class="line" x="4" y="30" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.697;0.967;0.999;1" dur="9s" repeatCount="indefinite"/>
      Full-Stack &#183; Real-Time &#183; Mobile
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="0" y="9" width="3" height="24" fill="#A78BFA">
    <animate attributeName="x" values="4;4;4;4;336;336;336;336;308;308;308;308;4" keyTimes="0;0.30;0.333;0.363;0.363;0.633;0.667;0.697;0.697;0.967;0.999;0.9995;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
