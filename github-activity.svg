import json
import os
import urllib.request
from datetime import date


USERNAME = "RATIWALRAHUL"

TOKEN = os.environ["GITHUB_TOKEN"]


QUERY = """
query($login:String!) {

  user(login:$login) {

    contributionsCollection {

      contributionCalendar {

        totalContributions

        weeks {

          contributionDays {

            date
            contributionCount

          }

        }

      }

    }

  }

}
"""


payload = json.dumps({
    "query": QUERY,
    "variables": {
        "login": USERNAME
    }
}).encode("utf-8")


request = urllib.request.Request(

    "https://api.github.com/graphql",

    data=payload,

    headers={
        "Authorization": f"Bearer {TOKEN}",
        "Content-Type": "application/json",
        "User-Agent": "RATIWALRAHUL-GitHub-Activity"
    },

    method="POST"
)


with urllib.request.urlopen(request) as response:

    result = json.load(response)


if "errors" in result:

    raise RuntimeError(
        json.dumps(
            result["errors"],
            indent=2
        )
    )


calendar = (
    result["data"]
    ["user"]
    ["contributionsCollection"]
    ["contributionCalendar"]
)


weeks = calendar["weeks"]

total = calendar["totalContributions"]


days = [

    day

    for week in weeks

    for day in week["contributionDays"]

]


maximum = max(

    [
        day["contributionCount"]
        for day in days
    ],

    default=1

)


def get_color(count):

    if count == 0:

        return "#161B22"

    ratio = count / maximum

    if ratio <= 0.20:

        return "#2D2148"

    if ratio <= 0.40:

        return "#51348A"

    if ratio <= 0.70:

        return "#7C4DCE"

    return "#A78BFA"


WIDTH = 1400

HEIGHT = 430

LEFT = 80

TOP = 125

CELL = 15

GAP = 5

WEEK_WIDTH = CELL + GAP

ROW_HEIGHT = CELL + GAP


svg = []


svg.append(
f'''
<svg xmlns="http://www.w3.org/2000/svg"
width="{WIDTH}"
height="{HEIGHT}"
viewBox="0 0 {WIDTH} {HEIGHT}">

<defs>

<linearGradient
id="background"
x1="0"
y1="0"
x2="1400"
y2="430">

<stop offset="0%" stop-color="#080A0F"/>
<stop offset="55%" stop-color="#0D1117"/>
<stop offset="100%" stop-color="#080A0F"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="18"/>

</filter>

</defs>

<rect
width="1400"
height="430"
rx="24"
fill="url(#background)"
/>

<rect
x="1"
y="1"
width="1398"
height="428"
rx="24"
fill="none"
stroke="#242B36"
/>

<circle
cx="1260"
cy="70"
r="130"
fill="#A78BFA"
opacity="0.08"
filter="url(#glow)"
/>

<text
x="45"
y="55"
fill="#FFFFFF"
font-family="Arial, Helvetica, sans-serif"
font-size="23"
font-weight="700"
letter-spacing="3">

GITHUB ACTIVITY

</text>

<text
x="45"
y="82"
fill="#8B949E"
font-family="Arial, Helvetica, sans-serif"
font-size="13">

RATIWALRAHUL · contribution activity

</text>

'''
)


# Month labels

months_seen = set()


for week_index, week in enumerate(weeks):

    for contribution in week["contributionDays"]:

        current_date = date.fromisoformat(
            contribution["date"]
        )

        if (
            current_date.day <= 7
            and current_date.month not in months_seen
        ):

            months_seen.add(
                current_date.month
            )

            x = (
                LEFT
                + week_index * WEEK_WIDTH
            )

            svg.append(
f'''
<text
x="{x}"
y="105"
fill="#8B949E"
font-family="Arial, Helvetica, sans-serif"
font-size="11">

{current_date.strftime("%b").upper()}

</text>
'''
            )

            break


# Weekday labels

for label, row in [
    ("MON", 1),
    ("WED", 3),
    ("FRI", 5)
]:

    y = (
        TOP
        + row * ROW_HEIGHT
        + 11
    )

    svg.append(
f'''
<text
x="38"
y="{y}"
fill="#8B949E"
font-family="Arial, Helvetica, sans-serif"
font-size="10">

{label}

</text>
'''
    )


# Contribution cells

for week_index, week in enumerate(weeks):

    for row_index, contribution in enumerate(
        week["contributionDays"]
    ):

        x = (
            LEFT
            + week_index * WEEK_WIDTH
        )

        y = (
            TOP
            + row_index * ROW_HEIGHT
        )

        count = contribution[
            "contributionCount"
        ]

        color = get_color(count)

        tooltip = (
            f'{contribution["date"]}: '
            f'{count} contributions'
        )

        svg.append(
f'''
<rect
x="{x}"
y="{y}"
width="{CELL}"
height="{CELL}"
rx="3"
fill="{color}">

<title>{tooltip}</title>

</rect>
'''
        )


# Bottom information

